[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # module-level import not at top of file (intentional in Lambda handlers)
    "E501",  # line too long (long strings in tool descriptions and CORS headers)
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["E402"]
"**/__init__.py" = ["F401"]  # re-exports are intentional
